name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: LocationReporter-for-github
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 34
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 失败时把真正的报错行写进摘要,打开 run 页面就能直接看到
      - name: Build Debug APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Print compile errors to summary
        if: steps.build.outputs.exit_code != '0'
        run: |
          echo "### 编译错误(e: 行)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by" build.log | head -40 >> $GITHUB_STEP_SUMMARY || echo "(未找到标准错误行,请展开 build 步骤看日志)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          exit 1

      - uses: actions/upload-artifact@v4
        if: steps.build.outputs.exit_code == '0'
        with:
          name: location-reporter-apk
          path: LocationReporter-for-github/app/build/outputs/apk/debug/*.apk
          retention-days: 30
