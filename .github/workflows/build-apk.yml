name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: LocationReporter-for-github
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK Platform 34
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        id: build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> $GITHUB_OUTPUT
          echo "gradle_exit_code=$code" | tee -a $GITHUB_STEP_SUMMARY
          exit $code

      # 失败时把真正的编译错误逐行变成 annotation,打开 run 页面即可看到
      - name: Expose compile errors
        if: failure() && steps.build.outputs.exit_code != '0'
        shell: bash
        run: |
          grep -nE "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by|Unresolved reference|No files were found" build.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "### 编译错误" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE "^e: |error:|FAILURE:|What went wrong|Execution failed|Caused by|Unresolved reference" build.log | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: location-reporter-apk
          path: LocationReporter-for-github/app/build/outputs/apk/debug/*.apk
          retention-days: 30
